<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Dasha Cabin</title>
  <meta name="description" content="Photos of Dasha Cabin: the living room, kitchen, bedrooms, porch views, and surrounding forest. [PLACEHOLDER]">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Dasha <span>Cabin</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">Menu</button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="amenities.html">Amenities</a>
        <a href="location.html">Location</a>
        <a href="rates.html">Rates</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container">
        <h1>Gallery</h1>
        <p class="lead">[PLACEHOLDER] A look around the cabin and the forest. Click any photo to enlarge.</p>
        <div class="gallery-grid">
          <figure>
            <img src="images/hero.jpg" alt="Cabin exterior at sunset with mountains behind [PLACEHOLDER photo]" data-full="images/hero.jpg">
            <figcaption>[PLACEHOLDER] The cabin at golden hour</figcaption>
          </figure>
          <figure>
            <img src="images/interior-living.jpg" alt="Living room with stone fireplace and leather armchairs [PLACEHOLDER photo]" data-full="images/interior-living.jpg">
            <figcaption>[PLACEHOLDER] Living room and fireplace</figcaption>
          </figure>
          <figure>
            <img src="images/interior-bedroom.jpg" alt="Bedroom with plaid bedding and forest view [PLACEHOLDER photo]" data-full="images/interior-bedroom.jpg">
            <figcaption>[PLACEHOLDER] Main bedroom</figcaption>
          </figure>
          <figure>
            <img src="images/interior-kitchen.jpg" alt="Rustic kitchen with farmhouse sink and cast iron pans [PLACEHOLDER photo]" data-full="images/interior-kitchen.jpg">
            <figcaption>[PLACEHOLDER] Kitchen</figcaption>
          </figure>
          <figure>
            <img src="images/exterior-porch.jpg" alt="Porch with rocking chairs overlooking a misty valley at sunrise [PLACEHOLDER photo]" data-full="images/exterior-porch.jpg">
            <figcaption>[PLACEHOLDER] Sunrise from the porch</figcaption>
          </figure>
          <figure>
            <img src="images/exterior-trail.jpg" alt="Forest trail leading to the cabin [PLACEHOLDER photo]" data-full="images/exterior-trail.jpg">
            <figcaption>[PLACEHOLDER] The trail to the cabin</figcaption>
          </figure>
          <figure>
            <img src="images/exterior-night.jpg" alt="Cabin under a starry winter sky with a campfire [PLACEHOLDER photo]" data-full="images/exterior-night.jpg">
            <figcaption>[PLACEHOLDER] Winter nights by the fire</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close photo viewer">&times;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <footer class="site-footer">
    <div class="container">
      <div>&copy; <span id="year">2026</span> Dasha Cabin. All rights reserved.</div>
      <div>[PLACEHOLDER] contact@dashacabin.example · +1 (555) 000-0000</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var toggle = document.querySelector('.nav-toggle');
    toggle.addEventListener('click', function () {
      var nav = document.getElementById('site-nav');
      var open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });

    // Simple lightbox
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.gallery-grid img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.dataset.full || img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('open');
      });
    });
    function closeLightbox() { lightbox.classList.remove('open'); }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
