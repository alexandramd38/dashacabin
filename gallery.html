<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie — Dasha Cabin</title>
  <meta name="description" content="Fotografii cu Dasha Cabin: livingul, bucătăria, dormitoarele, priveliștea de pe terasă și pădurea din jur. [PLACEHOLDER]">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Sari la conținut</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><img class="brand-logo" src="images/logo.png" alt="Dasha Cabin logo">Dasha <span>Cabin</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Deschide meniul">Meniu</button>
      <nav class="site-nav" id="site-nav" aria-label="Navigare principală">
        <a href="index.html">Acasă</a>
        <a href="gallery.html" aria-current="page">Galerie</a>
        <a href="amenities.html">Facilități</a>
        <a href="location.html">Locație</a>
        <a href="rates.html">Tarife</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container">
        <h1>Galerie</h1>
        <p class="lead">[PLACEHOLDER] O privire prin cabană și pădurea din jur. Apasă pe orice fotografie pentru a o mări.</p>
        <div class="gallery-grid">
          <figure>
            <img src="images/hero.jpg" alt="Exteriorul cabanei la apus, cu munții în fundal [PLACEHOLDER foto]" data-full="images/hero.jpg">
            <figcaption>[PLACEHOLDER] Cabana în lumina apusului</figcaption>
          </figure>
          <figure>
            <img src="images/interior-living.jpg" alt="Livingul cu șemineu din piatră și fotolii din piele [PLACEHOLDER foto]" data-full="images/interior-living.jpg">
            <figcaption>[PLACEHOLDER] Livingul și șemineul</figcaption>
          </figure>
          <figure>
            <img src="images/interior-bedroom.jpg" alt="Dormitor cu lenjerie în carouri și priveliște spre pădure [PLACEHOLDER foto]" data-full="images/interior-bedroom.jpg">
            <figcaption>[PLACEHOLDER] Dormitorul principal</figcaption>
          </figure>
          <figure>
            <img src="images/interior-kitchen.jpg" alt="Bucătărie rustică cu chiuvetă mare și tigăi de fontă [PLACEHOLDER foto]" data-full="images/interior-kitchen.jpg">
            <figcaption>[PLACEHOLDER] Bucătăria</figcaption>
          </figure>
          <figure>
            <img src="images/exterior-porch.jpg" alt="Terasa cu balansoare și priveliște spre valea învăluită în ceață la răsărit [PLACEHOLDER foto]" data-full="images/exterior-porch.jpg">
            <figcaption>[PLACEHOLDER] Răsăritul de pe terasă</figcaption>
          </figure>
          <figure>
            <img src="images/exterior-trail.jpg" alt="Potecă prin pădure care duce spre cabană [PLACEHOLDER foto]" data-full="images/exterior-trail.jpg">
            <figcaption>[PLACEHOLDER] Poteca spre cabană</figcaption>
          </figure>
          <figure>
            <img src="images/exterior-night.jpg" alt="Cabana sub cerul înstelat de iarnă, cu foc de tabără [PLACEHOLDER foto]" data-full="images/exterior-night.jpg">
            <figcaption>[PLACEHOLDER] Nopți de iarnă la foc</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Vizualizator foto">
    <button class="lightbox-close" id="lightbox-close" aria-label="Închide vizualizatorul">&times;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <footer class="site-footer">
    <div class="container">
      <div>&copy; <span id="year">2026</span> Dasha Cabin. Toate drepturile rezervate.</div>
      <div>[PLACEHOLDER] contact@dashacabin.example · +40 700 000 000</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var toggle = document.querySelector('.nav-toggle');
    toggle.addEventListener('click', function () {
      var nav = document.getElementById('site-nav');
      var open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });

    // Vizualizor foto simplu
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.gallery-grid img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.dataset.full || img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('open');
      });
    });
    function closeLightbox() { lightbox.classList.remove('open'); }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
